plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

base {
    archivesName = 'skyconstructionvoxyforge'
}

layout.buildDirectory.set(layout.projectDirectory.dir('build'))

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = "Modrinth"
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Основная зависимость NeoForge для Minecraft 1.21.1
    implementation "net.neoforged:neoforge:${neo_version}"

    // Sodium как обязательная клиентская зависимость
    implementation files('libs/sodium-neoforge-0.6.9+mc1.21.1.jar')

    // Voxy как клиентская зависимость
    implementation files('libs/voxy-neoforged-0.1.1-1.21.1-a0.2.14.jar')
}

runs {
    client {
        client()
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        jvmArguments.addAll '-Xmx6G', '-Xms2G'
    }
    server {
        server()
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments '--nogui'
    }
    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
